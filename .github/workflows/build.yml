name: Build & Release

# Build the macOS .dmg and Windows .zip. On a version tag (e.g. v1.0.0) the
# artifacts are published to a GitHub Release. You can also run it manually
# from the Actions tab (workflow_dispatch) to test a build without releasing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update releases

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generate icons
        run: |
          python packaging/make_icon.py
          iconutil -c icns packaging/AppIcon.iconset -o packaging/AppIcon.icns

      - name: Build .app
        working-directory: packaging
        run: |
          pyinstaller AnythingToMarkdown.spec --noconfirm --clean \
            --distpath ../dist --workpath ../build

      - name: Package .dmg
        run: bash packaging/build_dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Generate icon
        run: python packaging/make_icon.py

      - name: Build single-file .exe
        working-directory: packaging
        run: |
          pyinstaller AnythingToMarkdown.spec --noconfirm --clean `
            --distpath ../dist --workpath ../build

      - name: Name the executable with version
        shell: pwsh
        run: |
          $ver = python -c "import anytomd; print(anytomd.__version__)"
          $out = "dist/AnythingToMarkdown-$ver-windows-x64.exe"
          Move-Item dist/AnythingToMarkdown.exe $out -Force
          Write-Host "Built $out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
